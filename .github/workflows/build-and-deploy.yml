name: Build and Push Angular Client

# This workflow triggers on any push to the main branch
on:
  push:
    branches: [ "master" ]

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required permission to push to the GitHub Container Registry

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }} # This token is automatically provided by GitHub

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        # The tag for the image. e.g., ghcr.io/your-username/onyx-client:latest
        tags: ghcr.io/${{ github.repository_owner }}/onyx-client:latest 