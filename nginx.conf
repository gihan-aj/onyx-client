# This is the server block that defines the virtual server
server {
  # Listen on port 80, the standard HTTP port
  listen 80;

  # Define the root directory where the Angular files are located
  root /usr/share/nginx/html;

  # Set the default file to serve
  index index.html index.htm;

  # This is the most important part for an Angular app.
  # It tells NGINX to try serving the requested file ($uri),
  # then a directory with that name ($uri/),
  # and if neither exists, fall back to serving /index.html.
  # This allows Angular's router to take over and handle the client-side navigation.
  location / {
    try_files $uri $uri/ /index.html;
  }
}